name: Ninja Ball APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder
        id: find
        shell: bash
        run: |
          F=$(find . -name settings.gradle -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle topilmadi. Android fayllari repoga yuklanmagan."
            find . -maxdepth 3 -not -path "./.git/*" | head -n 60
            exit 1
          fi
          D=$(dirname "$F")
          echo "Loyiha papkasi: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NinjaBall-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
