plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ninjaball.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.ninjaball.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No third-party dependencies: only the Android framework (WebView, sockets).
